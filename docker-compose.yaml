
services:
  react:
    container_name: react
    build:
      context: ./react
    ports:
      - "5173:5173"
    volumes:
      - ./react:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stoped
    depends_on:
      - spring
    networks:
    - spring_net


  spring:
    container_name: spring
    ports:
    - "8080:8080"
    build:
      context: ./demo
    environment:
      NODE_ENV: docker
    restart: unless-stoped
    depends_on:
      - postgresdb
    networks:
      - spring_net


  postgresdb:
    image: postgres:16
    container_name: postgresdb
    environment:
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpassword
      POSTGRES_DB: companiesdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d companiesdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/data/database.202607071422.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stoped
    ports:
      - "5432:5432"
    networks:
      - spring_net

volumes:
  pgdata:

networks:
  spring_net:
    driver: bridge

  # global dump with psql

 