spring:
  application:
    name: demo

  # should change url to ./data/demo.db  
  datasource:
    url: jdbc:sqlite:demo.db 
    driver-class-name: org.sqlite.JDBC

    

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect

  jwt:
    secret: ${JWT_SECRET}
    expirationInSeconds: 900