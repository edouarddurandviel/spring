spring:
  application:
    name: demo

  # should change url to ./data/demo.db  
  datasource:
    url: jdbc:postgresql://localhost:5433/mydatabase 
    username: postgres
    driver-class-name: org.postgresql.Driver

    

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

    show-sql: true

  jwt:
    secret: ${JWT_SECRET}
    expirationInSeconds: 900